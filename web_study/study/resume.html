<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS 테스트 페이지</title>

    <!-- Internal CSS -->
    <style>
        /* . -> class, # -> id */
        .contents1 {
            text-align: center;
            background-color: lightblue;
        }
        .contents2 {
            text-align: center;
            background-color: lightgray;
        }
        header {
            font-size: xx-large;
            font-weight: bold;
        }
        #name {
            color: blue;
        }
        main {
            font-size: large;
        }
        footer {
            font-size: xx-small;
        }
        .green {
            color: green;
        }
        .red {
            color: red;
        }
        .blue {
            color: blue;
        }
    </style>

</head>
<body>
    <div class="contents1">
        <header id="name"> 한금준 </header>
        <main> DB 엔지니어 </main>
        <footer> Copyright &#169; 한금준 </footer>
    </div>
    <br>
    <div class="contents2">
        <header> 한금준 </header>
        <main> DB 엔지니어 </main>
        <footer> Copyright &#169; 한금준 </footer>
    </div>
    <br>
    <table border="1" width="100%">
        <thead>
            <tr>
                <th colspan="2"> 이력서 </th>
            </tr>
        </thead>
        <tbody>
            <tr class="green">
                <th> 이름 </th>
                <td> 한금준 </td>
            </tr>
            <tr class="red">
                <th> 직업 </th>
                <td> DB 엔지니어 </td>
            </tr>
            <tr class="blue">
                <th> 이메일 </th>
                <td> aaa@bbb.com </td>
            </tr>
        </tbod
    </table>
</body>
</html>
