<!DOCTYPE html>
<html lang="ko">
<!-- 웹 페이지에 대한 설정/정보 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS 테스트 페이지</title>
</head>
<body>
    <form action="https://google.com/search" method="get">
        <!-- get일 경우, URL에 파라미터로 담기는 걸 name에 작성 -->
        <input type="search" placeholder="이름을 입력하세요" name="q" autofocus>
        <button type="submit">검색</button>
    </form>
    <hr>
    <form action="https://httpbin.org/post" method="post">
        <!-- post일 경우, request 본문 내용에 담기는 걸 name에 작성 -->
        <input type="email" placeholder="이메일을 입력하세요" name="email" required>
        <br>
        <input type="password" placeholder="비밀번호를 입력하세요" name="password" required>
        <button type="submit">로그인</button>
    </form>
</body>
</html>
