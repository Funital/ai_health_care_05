<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS 테스트 페이지</title>

    <style>
        .body {
            height: 1000px;
        }
        .container {
            background-color: skyblue;
            width: 100px;
            height: 50px;

            margin: 50px;
        }

        .box {
            background-color: orange;
            width: 100px;
            height: 50px;
            
            /* relative position -> 이건 아래의 것들은 상관없이 자기 위치만 바꿈.*/
            position: relative; 
            left: 50px;
            top: 50px;

            /* 이건 전체적으로 이만큼 하겠다. 그래서 전부에 영향 미침. */
            margin: 50px;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
